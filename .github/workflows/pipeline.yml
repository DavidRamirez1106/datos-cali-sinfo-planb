name: lago-y-sitio

# Descarga el lago, lo verifica y publica el sitio en GitHub Pages.
# Requisito único: en Settings > Pages, "Source" = GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 11 1 * *"   # el día 1 de cada mes (6:00 a. m. en Bogotá)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas (datos sintéticos)
        run: python -m unittest discover -s tests
      # Si el portal de la Alcaldía está caído (como desde el 21-oct-2026), la ingesta falla
      # pero el sitio igual se publica y muestra el aviso de «fuentes no disponibles».
      - name: Ingesta real
        id: ingest
        continue-on-error: true
        run: python scripts/ingest.py
      # Para lo que el portal no entregó se usa la copia que el grupo descargó el 2026-10-06
      - name: Copia local (solo para las fuentes que fallaron)
        run: python scripts/snapshot.py
      - name: Datos del sitio
        run: python scripts/build_site_data.py
      - name: Verificación estricta
        continue-on-error: true
        run: python scripts/verify.py --strict
      - name: Guardar el lago como artefacto (auditoría)
        uses: actions/upload-artifact@v4
        with:
          name: lago
          path: lago/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
